<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rehan Ludo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>🎲 Rehan Ludo</h1>
    <p class="subtitle">A simple Ludo board demo</p>

    <section class="board" id="board" aria-label="Ludo board">
      <div class="home red">🔴</div>
      <div class="path" id="path"></div>
      <div class="home green">🟢</div>
      <div class="center">REHAN<br/>LUDO</div>
      <div class="home yellow">🟡</div>
      <div class="home blue">🔵</div>
    </section>

    <section class="controls">
      <button id="roll">Roll Dice 🎲</button>
      <div id="result">Tap the button to roll.</div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
